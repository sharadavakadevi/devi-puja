<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>దేవతల జాబితా</title>
<link rel="stylesheet" href="../style.css">
<script src="../script.js" defer></script>
</head>
<body>
<h1>దేవతల జాబితా</h1>
<button onclick="selectDevi('bala')">శ్రీ బాలా త్రిపురసుందరి దేవి</button><br><br>
<button onclick="selectDevi('gaythri')">శ్రీ గాయత్రీ దేవి</button><br><br>
<button onclick="selectDevi('annapurna')">శ్రీ అన్నపూర్ణా దేవి</button><br><br>
<button onclick="selectDevi('mahachandi')">శ్రీ కాత్యాయనీదేవి</button><br><br>
<button onclick="selectDevi('lalitha')">శ్రీ లలితా త్రిపురసుందరీదేవి</button><br><br>
<button onclick="selectDevi('saraswati')">శ్రీ సరస్వతీదేవి</button><br><br>
<button onclick="selectDevi('mahalakshmi')">శ్రీ మహాలక్ష్మీదేవి</button><br><br>
<button onclick="selectDevi('durga')">శ్రీ దుర్గాదేవి</button><br><br>
<button onclick="selectDevi('mahishasuramardini')">శ్రీ మహిషాసురమర్దినీదేవి</button><br><br>
<button onclick="selectDevi('rajarajeswari')">శ్రీ రాజరాజేశ్వరీదేవి</button><br><br>
</body>
</html>
